name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test
      STRIPE_SECRET_KEY: sk_test
      STRIPE_WEBHOOK_SECRET: whsec_test
      STRIPE_MONTHLY_PRICE_ID: price_monthly
      STRIPE_ANNUAL_PRICE_ID: price_annual
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright E2E tests
    needs: [lint-and-build, migrate]
    # migrate only runs on push-to-main (see its own `if`), so on PRs/other branches it's
    # skipped rather than successful — treat skipped as green so e2e still runs there. On
    # push-to-main, this makes e2e wait for migrate to actually finish applying before running,
    # so a schema-dependent test can't hit the DB mid-migration (see BACKLOG.md).
    if: |
      always() &&
      needs.lint-and-build.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    # Runs against the one real Supabase project (see e2e/support/test-users.ts) — there's no
    # staging environment. Test accounts are clearly tagged (e2e-test+<tag>-<timestamp>@
    # blessyourloaf.com) and each spec deletes its own via the admin API, which cascades
    # through every table an account can touch (see supabase/migrations FK chain).
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Supabase's anon/publishable key is designed to be public (it ships in the client JS
      # bundle in production too — access control is RLS, not secrecy), so this is committed
      # directly rather than added as a repo secret.
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtZ3Bubmh3Z3JlcXRpbHRkdmtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzQyMDQsImV4cCI6MjA5NjExMDIwNH0.VCzVg7DI2kI9W5E9C6OkRdXIa4YJRzzAObtMuTTuMNA
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test
      STRIPE_SECRET_KEY: sk_test
      STRIPE_WEBHOOK_SECRET: whsec_test
      STRIPE_MONTHLY_PRICE_ID: price_monthly
      STRIPE_ANNUAL_PRICE_ID: price_annual
      # Overridden to the local webServer URL by playwright.config.ts's webServer.env once the
      # app actually starts — kept here only so env.ts's zod validation has a well-formed URL
      # for any code path that runs before that (e.g. during `next build`).
      NEXT_PUBLIC_APP_URL: https://example.com
      # Every AI route constructs an Anthropic client at module load regardless of whether a
      # request needs it, and the SDK throws if no key is present at all — so this must always
      # be non-empty. Most specs never trigger a real call (the AI-quota test seeds usage so
      # the quota gate short-circuits first; the recipe-import test hits the structured-data
      # path before ever touching Anthropic), but ai-skills.spec.ts deliberately makes two real
      # calls end-to-end, so this has to be a working credential, not a placeholder.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  migrate:
    name: Apply database migrations
    needs: lint-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Push migrations
        run: supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  verify-schema:
    name: Verify expected tables exist
    needs: migrate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify-schema
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  deploy:
    name: Deploy to Vercel
    needs: verify-schema
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Vercel's automatic git-push deploys are disabled (see vercel.json:
      # git.deploymentEnabled). This Deploy Hook is the only path to production, and only
      # runs after lint-and-build, migrate, and verify-schema have all succeeded.
      - name: Trigger Vercel deploy hook
        run: curl --fail-with-body -sS -X POST "$VERCEL_DEPLOY_HOOK_URL"
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
